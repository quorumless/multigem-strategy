[project]
name = "pipeline"
version = "0.1.0"
description = "MultiGEM data pipeline: fetch, clean and splice monthly total-return data"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
