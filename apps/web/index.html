<!doctype html>
<html lang="en" dir="ltr" data-scheme="default">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>MultiGEM Strategy Lab</title>
    <meta name="title" content="MultiGEM Strategy Lab" />
    <meta
      name="description"
      content="Backtest and compare GEM dual-momentum strategies."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MultiGEM Strategy Lab" />
    <meta
      property="og:description"
      content="Backtest and compare GEM dual-momentum strategies."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="MultiGEM Strategy Lab" />
    <meta
      property="twitter:description"
      content="Backtest and compare GEM dual-momentum strategies."
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />
<script>
// Apply the saved color scheme before first paint (no flash). Keep in sync with src/lib/scheme.ts.
try { var s = localStorage.getItem('multigem.scheme'); if (s && /^[a-z-]+$/.test(s)) document.documentElement.dataset.scheme = s } catch (e) {}
</script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
